# Field hotspot settings, read by setup-hotspot.sh.
#
# Edit this, re-run the script, done. Everything the script installs is
# derived from these values, so this file is the single place a change
# has to be made - there is no second copy to keep in sync.

# What the phone sees in the WiFi list.
SSID="PumpBox"

# WPA2 passphrase. Must be 8-63 characters.
#
# Set this to "" to build an OPEN, unencrypted access point. That is a
# legitimate last resort: the box sits on private family land, its only
# exposed control is behind a 143V DC contactor, and an unreachable
# dashboard is worse than an unencrypted one. There is a documented
# report of a Zero W running Bookworm 32-bit whose NetworkManager AP
# refuses Android with "password incorrect" - if you hit that at the
# bench and STRICT_CIPHERS below does not fix it, empty this and re-run.
PSK="ReisLandPump2026"

# Wireless regulatory domain. Without this the radio stays rfkill
# soft-blocked and the AP activates "successfully" while transmitting
# nothing - the single most likely way to arrive at the field with a
# dead box.
COUNTRY="TR"

# Fixed 2.4GHz channel. The BCM43438 does an automatic channel scan
# badly in AP mode, and auto-selection can land on 12/13 which some
# phones are region-locked out of. 1, 6 or 11 only.
CHANNEL="6"

# The Pi's own address, and therefore the dashboard URL.
#
# Deliberately NOT NetworkManager's 10.42.0.1 default: Turkish mobile
# carriers hand out CGNAT addresses inside RFC1918 10.0.0.0/8, so a
# phone holding a 10.x cellular route can send 10.42.0.1 out the LTE
# interface instead of the WiFi one. The symptom is indistinguishable
# from a dead Pi. 192.168.4.0/24 has no such overlap.
AP_ADDR="192.168.4.1"
AP_PREFIX="24"

# Must match WEB_PORT in ../config.py. Only used for the printed URL;
# nothing here binds it.
WEB_PORT="8080"

# Interface. The Zero W has exactly one radio and no ethernet.
WIFI_IFACE="wlan0"

# NetworkManager profile name. Changing this after the first run leaves
# the old profile behind - run --undo first if you rename it.
AP_PROFILE="pump-ap"

# --- compatibility toggles -------------------------------------------
#
# "no"  leaves proto/pairwise/group unset, which is what NetworkManager's
#       own documentation recommends for maximum client compatibility.
# "yes" pins WPA2-AES only (proto rsn, pairwise+group ccmp).
#
# The field evidence here is genuinely contradictory: one Raspberry Pi
# forum thread reports Android connecting only after REMOVING the cipher
# pinning, an Arch thread reports the opposite. Default to the permissive
# setting and flip it only if your own phone refuses at the bench.
STRICT_CIPHERS="no"

# 802.11w / protected management frames.
#   1 = disable, 2 = optional, 3 = required.
#
# NetworkManager's default (0) resolves to "optional" for wpa-psk, so the
# AP advertises PMF-capable. brcmfmac's AP path handles 802.11w poorly and
# a failed PMF negotiation surfaces on Android as "incorrect password" -
# the exact string in the reported failure. Disabling it is the first
# thing to try if the phone will not associate.
PMF="1"

# Answer Android's/Apple's captive-portal probes so the phone stops
# nagging about "no internet" and stops routing your dashboard request
# out the cellular interface. Additive and safe to turn off.
#
# This REDUCES the problem, it does not solve it - modern Android also
# runs an HTTPS probe that cannot be satisfied without a trusted
# certificate. Putting the phone in airplane mode before joining is the
# actual guarantee. See README.
ENABLE_PORTAL="yes"
