# dnsmasq drop-in for NetworkManager's shared-mode instance.
# Installed to /etc/NetworkManager/dnsmasq-shared.d/pump-portal.conf
#
# Android decides a network is usable by fetching
# http://connectivitycheck.gstatic.com/generate_204 over it. With no
# upstream that fetch fails, the network is marked unvalidated, and the
# failure mode is NOT usually "WiFi disconnects" - it is "WiFi stays
# connected but the browser's request to the Pi leaves via LTE and dies."
# That is indistinguishable from a broken Pi, which is the whole reason
# this file exists.
#
# Pointing only the named probe domains at the Pi, rather than a
# address=/#/ wildcard: a wildcard hijacks ALL DNS for the phone while it
# is joined, breaking every other app on it.

address=/connectivitycheck.gstatic.com/__AP_ADDR__
address=/connectivitycheck.android.com/__AP_ADDR__
address=/clients3.google.com/__AP_ADDR__
address=/www.gstatic.com/__AP_ADDR__
address=/captive.apple.com/__AP_ADDR__
