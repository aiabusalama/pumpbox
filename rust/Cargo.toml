[package]
name = "pumpd"
version = "1.0.0"
edition = "2021"
description = "Solar pump overvoltage protection and control"

[dependencies]
serialport = { version = "4", default-features = false }
rppal = "0.17"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "z"     # this runs at 2 Hz; size matters more than speed
lto = true
codegen-units = 1
strip = true
panic = "abort"     # a panicking controller must die and be restarted,
                    # not unwind into an unknown state with the relay closed
